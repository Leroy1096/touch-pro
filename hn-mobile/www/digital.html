<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TOUCH PRO DIGITAL — Création & communication | Oupoyo</title>
  <meta name="description" content="TOUCH PRO DIGITAL : shooting photo, logos, flyers, vidéos publicitaires, sites web, contenus réseaux sociaux, musiques personnalisées. Devis gratuit.">
  <link rel="icon" type="image/png" href="images/tp/favicon-tp.png">
  <meta name="theme-color" content="#0b0a08">
  <link rel="stylesheet" href="css/style.css?v=17">
  <link rel="stylesheet" href="css/touchpro.css?v=19">
</head>
<body>
  <section class="tp-hero compact" style="--hero-img:url('/images/tp/dept-digital.jpg')">
    <div class="wrap">
      <p class="tp-signature" style="color:#7a5ac0">DÉPARTEMENT 05</p>
      <h1>🎨 TOUCH PRO <span>DIGITAL</span></h1>
      <p class="tp-intro">Création et communication digitale : donnez une image professionnelle à votre activité.</p>
    </div>
  </section>

  <section class="tp-section">
    <div class="wrap">
      <div class="tp-section-titre"><em>NOS EXPERTISES</em><h2>Création digitale & musique</h2>
        <p style="color:var(--gris)">Touchez un service : le formulaire de devis se pré-remplit automatiquement.</p>
      </div>
      <div class="catalogue-grille" id="catalogueDigital"></div>

      <div class="tp-section-titre" style="margin-top:4rem"><em>DEVIS GRATUIT</em><h2>Demande de devis</h2></div>
      <form id="formDevis" class="form-tp" novalidate>
        <div class="hp"><label>Ne pas remplir<input name="entreprise" tabindex="-1" autocomplete="off"></label></div>
        <label>Votre nom *<input name="nom" required maxlength="80"></label>
        <label>Téléphone *<input name="telephone" required maxlength="20" placeholder="01 02 03 04 05"></label>
        <label>E-mail (optionnel)<input name="email" type="email" maxlength="120"></label>
        <label>Service souhaité *
          <select name="service">
            <option>Design Graphique</option><option>Réseaux Sociaux</option>
            <option>Photo / Vidéo</option><option>Web / Tech</option>
            <option>Branding / Entreprise</option><option>Musique pour une personne</option>
            <option>Musique Business / Marque</option><option>Musique pour Événement</option>
            <option>Production / Studio</option><option>Autre</option>
          </select>
        </label>
        <label>Décrivez votre projet *<textarea name="description" required maxlength="800" rows="4"></textarea></label>
        <label>Budget estimé (FCFA, optionnel)<input name="budget" type="number" min="0" max="100000000" placeholder="Ex. 25000"></label>
        <div id="alerteDevis"></div>
        <button class="btn btn-or btn-bloc" type="submit" style="margin-top:1.2rem">Recevoir mon devis</button>
      </form>
    </div>
  </section>
  <script type="module" src="js/tp-digital.js?v=19"></script>
</body>
</html>
