<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boutique — TOUCH PRO | Accessoires, mode, gadgets</title>
  <meta name="description" content="Boutique TOUCH PRO : accessoires téléphone, gadgets, mode. Commandez en ligne, payez à la livraison ou en boutique.">
  <link rel="icon" type="image/png" href="images/tp/favicon-tp.png">
  <meta name="theme-color" content="#0b0a08">
  <link rel="stylesheet" href="css/style.css?v=18">
  <link rel="stylesheet" href="css/touchpro.css?v=18">
  <style>
    .hp { position:absolute; left:-9999px; opacity:0 }
    #badgePanier { display:none !important } /* remplacé par la barre panier SHEIN */
  </style>
</head>
<body>
  <div class="shop-page">

    <!-- Barre recherche + compte (sticky, façon SHEIN) -->
    <div class="shop-topbar">
      <div class="shop-recherche">
        <span aria-hidden="true">🔍</span>
        <input id="recherche" type="search" placeholder="Rechercher un article…" autocomplete="off" enterkeyhint="search">
      </div>
      <a class="shop-compte" href="compte.html" aria-label="Mon compte">👤</a>
    </div>

    <!-- Bandeau avantages -->
    <div class="shop-avantages">
      <span>🛵 Livraison disponible</span><i>•</i>
      <span>💵 Paiement à la livraison</span><i>•</i>
      <span>🏬 Retrait boutique gratuit</span>
    </div>

    <!-- Chips catégories (scroll horizontal, sticky) -->
    <nav class="shop-chips" id="chips" aria-label="Catégories">
      <button data-dep="" class="actif">Tout</button>
      <button data-dep="access">🎧 Accessoires</button>
      <button data-dep="fashion">👕 Fashion</button>
      <button data-dep="tech">📱 Tech</button>
      <button data-dep="digital">🎨 Digital</button>
    </nav>

    <!-- Grille produits -->
    <main class="shop-grille" id="grille"><div class="tp-vide">Chargement…</div></main>

    <p class="shop-note">💬 Une question sur un article ? <a id="waShop" href="#" target="_blank" rel="noopener">Écrivez-nous sur WhatsApp</a></p>
  </div>

  <!-- Barre panier fixe en bas (façon SHEIN) -->
  <div class="shop-barre-panier" id="barrePanier" hidden>
    <div class="total">
      <small id="nbArticles">0 article</small>
      <strong id="totalBarre">0 FCFA</strong>
    </div>
    <button class="btn btn-or" id="btnVoirPanier">🛒 Voir le panier</button>
  </div>

  <!-- Tiroir panier (bottom sheet) -->
  <div class="shop-overlay" id="overlay" hidden></div>
  <aside class="shop-tiroir" id="tiroir" hidden aria-label="Panier">
    <div class="tiroir-poignee"></div>
    <div class="tiroir-tete">
      <h3>🛒 Mon panier</h3>
      <button id="btnFermerTiroir" aria-label="Fermer">✕</button>
    </div>
    <div class="tiroir-corps">
      <div id="contenuPanier"></div>
      <form id="formCommande" class="form-tp" novalidate hidden>
        <h4>📦 Finaliser la commande</h4>
        <div class="hp"><label>Ne pas remplir<input name="entreprise" tabindex="-1" autocomplete="off"></label></div>
        <label>Votre nom *<input name="nom" required maxlength="80" placeholder="Ex. Awa Koné"></label>
        <label>Téléphone *<input name="telephone" required maxlength="20" placeholder="Ex. 01 02 03 04 05"></label>
        <label>Mode de récupération *
          <select name="livraison">
            <option value="boutique">🏬 Retrait en boutique (gratuit)</option>
            <option value="livraison">🛵 Livraison (frais à convenir sur WhatsApp)</option>
          </select>
        </label>
        <label id="zoneAdresse" hidden>Adresse de livraison<input name="adresse" maxlength="200" placeholder="Quartier, rue, repère"></label>
        <label>Note (optionnel)<textarea name="note" maxlength="300" rows="2" placeholder="Couleur, précision…"></textarea></label>
        <p class="tiroir-paiement">💵 Paiement à la livraison ou en boutique — aucun paiement en ligne.</p>
        <div id="alerteCmd"></div>
        <button class="btn btn-or btn-bloc" id="btnCommander" type="submit">Valider ma commande</button>
      </form>
    </div>
  </aside>

  <script type="module" src="js/tp-boutique.js?v=18"></script>
</body>
</html>
